{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width: 560px">
  <div class="display-1 fw-700 text-primary">{{ code }}</div>
  <h1 class="h3 fw-600 mb-2">{{ title }}</h1>
  <p class="text-secondary mb-4">{{ message }}</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to home</a>
  <a href="{{ url_for('listings.browse') }}" class="btn btn-outline-primary">Browse listings</a>
</div>
{% endblock %}
